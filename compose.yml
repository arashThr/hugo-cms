services:
  hugo-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hugo-ui
    restart: unless-stopped
    ports:
      - "9000:3000"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GITHUB_ID=${GITHUB_ID}
      - GITHUB_SECRET=${GITHUB_SECRET}
    # Exposing 9000 to the host so Caddy can reverse proxy to it
